# infra/rapports/nginx.conf
# Rapports HTML Playwright du NAS servis en HTTP (liens 📊 Rapport des dashboards Grafana)
# Un lien file:// cliqué depuis Grafana est bloqué par Chrome / Edge ; le visualiseur de traces exige HTTP.

server {
  listen 80;
  root /usr/share/nginx/html;
  charset utf-8;

  autoindex on;                 # navigation <machine>/test-output/runs/run-…/
  autoindex_localtime on;

  # Rapports immuables une fois écrits, mais un run en cours peut réécrire index.html
  add_header Cache-Control "no-cache";

  location / {
    try_files $uri $uri/ =404;
  }
}
